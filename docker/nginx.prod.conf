# 多專案 gateway
#   /                 → 專案入口
#   /daily-huangli/   → 每日黃曆
# 之後新增專案：加 location + 對應 html 子目錄

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 專案入口
    location = / {
        try_files /index.html =404;
    }

    # ---------- 每日黃曆 ----------
    location = /daily-huangli {
        return 301 /daily-huangli/;
    }

    # 使用 root + 子目錄（比 alias 穩，try_files 正常）
    location /daily-huangli/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /daily-huangli/index.html;
    }

    # 快取策略（前綴匹配較 location 正則優先級低時可放後；此處用 extra map 簡化）
    location ~* ^/daily-huangli/sw\.js$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* ^/daily-huangli/.*\.(html|webmanifest)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* ^/daily-huangli/.*\.(js|json)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~* ^/daily-huangli/.*\.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---------- 範例：下一個專案 ----------
    # location = /my-app { return 301 /my-app/; }
    # location /my-app/ {
    #     root /usr/share/nginx/html;
    #     try_files $uri $uri/ /my-app/index.html;
    # }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
