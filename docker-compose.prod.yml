# ConoHa VPS 正式環境（僅靜態站，與 GitHub Pages 相同內容）
# 用法（在伺服器上）：
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: daily-huangli-web:prod
    container_name: daily-huangli
    restart: unless-stopped
    ports:
      # 若前面有主機 nginx／Caddy 反代，可改 127.0.0.1:8080:80
      - "${HUANGLI_PUBLISH:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
