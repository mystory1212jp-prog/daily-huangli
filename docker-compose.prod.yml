# ConoHa VPS 正式環境（多專案 gateway）
#   http://IP/                 → 專案入口
#   http://IP/daily-huangli/   → 每日黃曆
# 用法：
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        APP_BASE_PATH: daily-huangli
    image: daily-huangli-web:prod
    container_name: daily-huangli
    restart: unless-stopped
    ports:
      - "${HUANGLI_PUBLISH:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/daily-huangli/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
