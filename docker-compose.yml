# 每日黃曆 Docker Compose
# 用途：本機開發預覽、重建資料庫、在容器內 git push
# 不影響 GitHub Pages：線上仍是 main 分支靜態檔，無 Docker 執行期依賴。
#
# 常用：
#   docker compose up web -d          # http://localhost:8765
#   docker compose run --rm tools bash
#   docker compose run --rm tools python scripts/build_db.py
#   make docker-rebuild-all

services:
  # 靜態預覽（與 GitHub Pages 相同：純 HTML/JS/JSON）
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: daily-huangli-web:local
    container_name: daily-huangli-web
    ports:
      - "${HUANGLI_PORT:-8765}:80"
    volumes:
      # 掛載專案根目錄 → 改碼即時生效，不影響主機既有檔案權限以外的使用
      - .:/usr/share/nginx/html:ro
    restart: unless-stopped

  # 開發／建置工具（Python 節氣精算、git、gh）
  tools:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    image: daily-huangli-tools:local
    container_name: daily-huangli-tools
    working_dir: /app
    volumes:
      - .:/app
      # 可選：沿用主機 git 設定與 SSH（推 GitHub 時）
      - ${HOME}/.gitconfig:/root/.gitconfig:ro
      - ${HOME}/.ssh:/root/.ssh:ro
    environment:
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-}
      - GIT_COMMITTER_NAME=${GIT_COMMITTER_NAME:-}
      - GIT_COMMITTER_EMAIL=${GIT_COMMITTER_EMAIL:-}
    # 不常駐；用 run 執行指令
    profiles:
      - tools
    stdin_open: true
    tty: true
